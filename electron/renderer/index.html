<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RP-Hand</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="stage" aria-label="RP-Hand 摄像头手势控制">
      <section id="startup-screen" aria-label="RP-Hand 正在启动" aria-live="polite">
        <img
          class="startup-brand"
          src="assets/roboparty.svg"
          alt="RoboParty"
        >
        <div class="startup-center">
          <div class="startup-runner" aria-hidden="true">
            <div class="startup-runner-strip"></div>
          </div>
          <p id="startup-label">Loading</p>
        </div>
        <div
          id="startup-progress"
          class="startup-progress"
          role="progressbar"
          aria-label="启动进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="8"
        ><span id="startup-progress-bar"></span></div>
      </section>
      <img id="frame" alt="实时手部识别画面和 RP-Hand 运行数据">
      <section id="control-panel" aria-label="识别与模式控制">
        <div class="control-row">
          <span id="detection-label">手部识别</span>
          <button
            id="detection-toggle"
            type="button"
            role="switch"
            aria-labelledby="detection-label"
            aria-checked="true"
          ><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button>
        </div>
        <div class="control-row">
          <span id="sending-label">指令发送</span>
          <button
            id="sending-toggle"
            type="button"
            role="switch"
            aria-labelledby="sending-label"
            aria-checked="true"
          ><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button>
        </div>
        <div class="control-row">
          <label for="mode-select">控制模式</label>
          <select id="mode-select">
            <option value="mirror">连续映射</option>
          </select>
        </div>
        <div class="control-row">
          <span id="recovery-label">急停恢复</span>
          <button
            id="recover-control"
            type="button"
            aria-labelledby="recovery-label"
            disabled
          >恢复控制</button>
        </div>
      </section>
      <button
        id="emergency-stop"
        type="button"
        aria-pressed="false"
      >紧急停止</button>
      <p id="process-state" role="status" aria-live="polite" hidden></p>
    </main>
    <script src="layout.cjs"></script>
    <script src="startup-state.cjs"></script>
    <script src="app.js"></script>
  </body>
</html>
